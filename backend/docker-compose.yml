# Docker Compose配置
version: '3.8'

services:
  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: iot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wlw}
      MYSQL_USER: ${MYSQL_USER:-wlw_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wlw_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot_network

  # Redis服务（用于缓存和Celery）
  redis:
    image: redis:7-alpine
    container_name: iot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot_network

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot_network

  # Django后端服务
  backend:
    build: .
    container_name: iot_backend
    restart: always
    depends_on:
      - mysql
      - redis
      - mosquitto
    environment:
      DJANGO_SETTINGS_MODULE: iot_system.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-wlw}
      DB_USER: ${MYSQL_USER:-wlw_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-wlw_password}
      REDIS_URL: redis://redis:6379/1
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - .:/app
      - media_volume:/app/media
      - logs_volume:/app/logs
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn iot_system.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers 4
      "
    networks:
      - iot_network

  # Celery Worker
  celery_worker:
    build: .
    container_name: iot_celery_worker
    restart: always
    depends_on:
      - redis
      - mysql
    environment:
      DJANGO_SETTINGS_MODULE: iot_system.settings
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/app
    command: celery -A iot_system worker -l info
    networks:
      - iot_network

volumes:
  mysql_data:
  redis_data:
  media_volume:
  logs_volume:

networks:
  iot_network:
    driver: bridge
